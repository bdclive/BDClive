<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Dashboard v7.9.7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script data-cfasync="false" src="https://video.ibm.com/embed-api/v1/ustream-embedapi.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117; --card-bg: #161b22; --border-color: #30363d;
            --text-main: #ffffff; --text-dim: #8b949e; 
            --snap-yellow: #FFFC00; --bsky-electric: #00D2FF;
            --light-purple: #bc95ff; --plex-orange: #e5a00d; --cinema-green: #238636;
            --twitch-purple: #9146FF; --fb-blue: #0866ff;
            --yt-red: #FF0000; --tt-cyan: #00f2ea; --ig-pink: #E1306C;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; padding: 15px; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .timer-stage { width: 100%; max-width: 1400px; height: 195px; margin-bottom: 25px; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; background: #000; position: relative; }
        .timer-stage iframe { width: 100%; height: 350px; border: none; position: absolute; top: -92px; left: 0; border-radius: 12px; }
        .counter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; max-width: 1400px; }
        .counter-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; height: 150px; position: relative; display: flex; flex-direction: column; justify-content: center; padding-left: 25px; padding-bottom: 10px; overflow: hidden; transition: 0.3s; }
        .box-logo { position: absolute; top: 12px; right: 15px; width: 22px; height: 22px; z-index: 20; display: flex; align-items: center; justify-content: center; }
        .box-logo svg { width: 100%; height: 100%; }
        .counter-item iframe { filter: invert(1) hue-rotate(180deg); border: 0; width: 450px; height: 220px; position: absolute; top: 10px; left: -85px; pointer-events: none; }
        .main-number { font-size: 3.1rem; font-weight: 800; color: #ffffff; margin: 0; white-space: nowrap; letter-spacing: -2px; line-height: 1.1; }
        .mirror-box { justify-content: space-evenly !important; padding-left: 0 !important; text-align: center; }
        .mirror-row { display: flex; justify-content: space-around; width: 100%; margin-top: 5px; }
        .mirror-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; font-weight: bold; margin: 0; }
        .mirror-stat { font-size: 2rem; font-weight: 800; color: #ffffff; margin-bottom: 2px; }
        .cinema-info { padding: 12px 20px 12px 15px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; height: 100%; text-align: left; }
        .cinema-label { font-size: 9px; color: var(--cinema-green); text-transform: uppercase; font-weight: bold; }
        .cinema-title { font-size: 13px; font-weight: bold; color: #ffffff; line-height: 1.2; margin-top: 2px; height: 32px; overflow: hidden; }
        .cinema-footer { position: absolute; bottom: 0; left: 0; right: 0; background: #0d1117; padding: 6px 12px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .cinema-stats-line { font-size: 10px; color: var(--plex-orange); display: flex; justify-content: space-between; font-weight: bold; }
        .status-container { display: flex; align-items: center; gap: 8px; position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border-color); }
        .dot { height: 8px; width: 8px; background-color: #484f58; border-radius: 50%; }
        .dot.live { background-color: #ff0000; box-shadow: 0 0 8px #ff0000; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .status-text { font-size: 10px; font-weight: bold; color: var(--text-dim); }

        /* MODAL POPUP */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal-content { background-color: #161b22; margin: 5% auto; padding: 20px; border: 1px solid var(--plex-orange); width: 85%; max-width: 900px; border-radius: 12px; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .close-modal { position: absolute; top: 10px; right: 20px; color: var(--text-dim); font-size: 35px; font-weight: bold; cursor: pointer; }
        .close-modal:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="timer-stage"><iframe src="https://board.multitimer.net/view/?q=6z0n8w08m0"></iframe></div>
    
    <div class="counter-grid">
        <div class="counter-item mirror-box" style="border-top: 3px solid var(--light-purple);">
            <i class="fa-solid fa-wand-magic-sparkles box-logo" style="color:var(--light-purple);"></i>
            <div><p class="mirror-label" style="color:var(--light-purple);">✨ Tales Detected</p><div id="totalViewsCounter" class="mirror-stat" style="font-size: 2.5rem;">0</div></div>
            <div class="mirror-row">
                <div><p class="mirror-label">👥 Online</p><div id="visitorCounter" class="mirror-stat">0</div></div>
                <div><p class="mirror-label" style="color:var(--plex-orange);">🎬 Plex</p><div id="plex-count-num" class="mirror-stat">0</div></div>
            </div>
        </div>

        <div class="counter-item" style="border-top: 3px solid #ffffff;">
            <div class="box-logo"><svg viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.045 4.126H5.078z"/></svg></div>
            <iframe scrolling="no" src="https://livecounts.io/embed/twitter-live-follower-counter/briandivacox"></iframe>
        </div>

        <div class="counter-item mirror-box" style="border-top: 3px solid var(--twitch-purple);">
            <i class="fa-brands fa-twitch box-logo" style="color:var(--twitch-purple);"></i>
            <div><p class="mirror-label" style="color:var(--twitch-purple);">🟣 Followers</p><div id="twitch-fol-num" class="mirror-stat" style="font-size: 2.5rem;">---</div></div>
            <div class="mirror-row">
                <div><p class="mirror-label">👁️ Viewers</p><div id="twitch-view-num" class="mirror-stat">0</div></div>
            </div>
        </div>

        <div class="counter-item" style="border-top: 3px solid var(--yt-red);">
            <i class="fa-brands fa-youtube box-logo" style="color:var(--yt-red);"></i>
            <iframe scrolling="no" src="https://livecounts.io/embed/youtube-live-subscriber-counter/UCMuv7PfbLVm8IZsd6Bgqqzg"></iframe>
        </div>

        <div class="counter-item" style="border-top: 3px solid var(--tt-cyan);">
            <i class="fa-brands fa-tiktok box-logo" style="color:var(--tt-cyan);"></i>
            <iframe scrolling="no" src="https://livecounts.io/embed/tiktok-live-follower-counter/briandivacox"></iframe>
        </div>

        <div class="counter-item" style="border-top: 3px solid var(--ig-pink);">
            <i class="fa-brands fa-instagram box-logo" style="color:var(--ig-pink);"></i>
            <iframe scrolling="no" src="https://livecounts.nl/instagram-realtime/embed/?u=briandivacox"></iframe>
        </div>
        
        <div class="counter-item" style="border-top: 3px solid var(--bsky-electric);">
            <div class="box-logo">
                <svg viewBox="0 0 566 500" preserveAspectRatio="xMidYMid meet">
                    <path fill="var(--bsky-electric)" d="M121.2 35.6C191.6 86.9 282.9 178.1 282.9 178.1S374.2 86.9 444.7 35.6C502.9-6.8 566 -20.3 566 49.3c0 19.3-11.2 121.1-17.8 144.6-21 75-52.2 89.8-118.4 104.8 134.5 25.3 152.9 70.6 152.9 101.7 0 71-65.4 63.3-119 31.9-74.5-43.8-139.8-138.8-179.9-195.1-40.1 56.3-105.4 151.3-179.9 195.1-53.6 31.5-119 39.1-119-31.9 0-31.1 18.4-76.4 152.9-101.7C46.2 283.7 15 268.9 0 193.9c-6.6-23.5-17.8-125.3-17.8-144.6 0-69.6 63.1-56.1 121.2-13.7z"/>
                </svg>
            </div>
            <div id="bsky-num" class="main-number">---</div>
        </div>

        <div class="counter-item mirror-box" style="border-top: 3px solid #8b949e;">
            <i class="fa-brands fa-threads box-logo" style="color:white;"></i>
            <div><p class="mirror-label">🧵 Threads Views</p><div id="threads-view-num" class="mirror-stat" style="font-size: 2.5rem;">0</div></div>
            <div class="mirror-row">
                <div><p class="mirror-label">👥 Followers</p><div id="threads-fol-num" class="mirror-stat">0</div></div>
            </div>
        </div>

        <div class="counter-item" id="court-box" style="border-top: 3px solid var(--plex-orange); background: #000; cursor: pointer; padding: 0; display: block;" onclick="openCourt()">
            <div style="width: 100%; height: 100%; overflow: hidden; position: relative; border-radius: 10px;">
                <iframe id="court-player" src="https://video.ibm.com/embed/23891775?showtitle=false&volume=0" 
                    style="width: 600px; height: 338px; border: none; position: absolute; top: -12px; left: -55px; transform: scale(0.48); transform-origin: top left; pointer-events: none;">
                </iframe>
                <div style="position: absolute; top: 10px; left: 15px; z-index: 30; text-shadow: 2px 2px 4px #000;">
                    <h4 style="margin: 0; font-size: 14px; color: #fff;">Court Stream</h4>
                    <p id="court-subtitle" style="font-size: 11px; color: var(--plex-orange); margin: 0;">Judge David</p>
                </div>
                <div class="status-container" style="z-index: 30; bottom: 8px; left: 8px;">
                    <span id="court-dot" class="dot"></span>
                    <span id="court-text" class="status-text">OFF AIR</span>
                </div>
                <i class="fa-solid fa-expand box-logo" style="color: rgba(255,255,255,0.5); font-size: 14px;"></i>
            </div>
        </div>

        <div class="counter-item" style="border-top: 3px solid var(--snap-yellow);">
            <i class="fa-brands fa-snapchat box-logo" style="color:var(--snap-yellow);"></i>
            <div id="snap-fol-num" class="main-number">0</div>
        </div>

        <div class="counter-item mirror-box" style="border-top: 3px solid var(--fb-blue);">
            <i class="fa-brands fa-facebook box-logo" style="color:var(--fb-blue);"></i>
            <div><p class="mirror-label" style="color:var(--fb-blue);">🔵 FB Page</p><div id="fb-page-num" class="mirror-stat" style="font-size: 2.5rem;">0</div></div>
            <div class="mirror-row">
                <div><p class="mirror-label">👤 Personal</p><div id="fb-personal-num" class="mirror-stat">0</div></div>
            </div>
        </div>

        <div class="counter-item" style="border-top: 3px solid var(--cinema-green); padding-left: 0;">
            <i class="fa-solid fa-film box-logo" style="color: var(--cinema-green);"></i>
            <div class="cinema-info">
                <div><div class="cinema-label">Now Playing</div><div id="m-now" class="cinema-title">Syncing...</div><div id="m-left" style="font-size: 10px; color: var(--text-dim);">--</div></div>
                <div style="border-left: 1px solid var(--border-color); padding-left: 10px;">
                    <div class="cinema-label" style="color: var(--plex-orange);">Up Next</div><div id="m-next" class="cinema-title">--</div><div id="m-time" style="font-size: 10px; color: var(--text-dim);">--</div>
                </div>
            </div>
            <div class="cinema-footer">
                <div class="cinema-stats-line"><span>M: <span id="m-count">--</span></span><span>TV: <span id="tv-count">--</span></span><span style="color: var(--cinema-green);">S: <span id="sync-timer">LIVE</span></span></div>
                <div style="font-size: 9px; color: var(--text-dim); display: flex; justify-content: space-between;"><span>Open: <span id="m-open">--</span></span><span>v7.9.7</span></div>
            </div>
        </div>
    </div>

    <div id="courtModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCourt()">&times;</span>
            <h3 style="margin-top: 0; color: var(--plex-orange);">Live Court Feed</h3>
            <iframe id="modal-player" width="100%" height="500" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const sConf = { apiKey: atob("QUl6YVN5QXZ4ZktnX3NwUE52RTJ3Y1QtdlRsOFlUUXU0TDN0Xzd3"), authDomain: "livecounters-8eaa8.firebaseapp.com", projectId: "livecounters-8eaa8", databaseURL: "https://livecounters-8eaa8-default-rtdb.firebaseio.com/", appId: "1:386919719539:web:c60c0d185c3d7e97ecc006" };
        const vConf = { apiKey: "AIzaSyCokXnEtboNuUIASBMz2ZzS0GuchemoJYI", authDomain: "lbbb-webcounter.firebaseapp.com", projectId: "lbbb-webcounter", databaseURL: "https://lbbb-webcounter-default-rtdb.firebaseio.com/", appId: "1:217634980859:web:49ef2b0aa7fe7d0bb1415e" };
        const sApp = firebase.initializeApp(sConf, "sApp"); const vApp = firebase.initializeApp(vConf, "vApp");
        const sDb = sApp.database(); const vDb = vApp.database();

        vDb.ref("totalViewCount").on("value", s => document.getElementById("totalViewsCounter").innerText = s.val() || 0);
        vDb.ref("visitorsConnected").on("value", s => document.getElementById("visitorCounter").innerText = s.numChildren() || 0);
        
        sDb.ref('labData').on('value', (s) => {
            const d = s.val(); if (!d) return;
            const plexCount = d.plexCount || d.plex_sessions || d.watching || d.plex || 0;
            document.getElementById('plex-count-num').innerText = plexCount;
            document.getElementById('threads-fol-num').innerText = d.threadsFol || "0"; 
            document.getElementById('threads-view-num').innerText = d.threadsViews || "0"; 
            document.getElementById('snap-fol-num').innerText = d.snapFol || "0"; 
            document.getElementById('fb-page-num').innerText = d.fbPage || "0";
            document.getElementById('fb-personal-num').innerText = d.fbPersonal || "0";
        });

        let nowInt, nextInt, localNowSecs = 0;
        sDb.ref('theaterSync').on('value', (snapshot) => {
            const m = snapshot.val(); if (!m) return;
            const isIdle = !m.nowPlaying || m.nowPlaying.toLowerCase() === "offline" || m.nowPlaying === "" || m.nowPlaying === "No Movie Playing";
            
            document.getElementById('m-now').innerText = isIdle ? "Off-Air" : m.nowPlaying;
            document.getElementById('m-count').innerText = m.moviesCount || "0";
            document.getElementById('tv-count').innerText = m.tvCount || "0";
            document.getElementById('m-next').innerText = m.nextTitle || "None";
            document.getElementById('m-open').innerText = m.daysOpen || "0";

            clearInterval(nowInt); const nowEl = document.getElementById('m-left');
            if (isIdle || !m.timeLeft || m.timeLeft.includes("--") || m.timeLeft.includes("N/A")) {
                nowEl.innerText = "Cinema Idle";
            } else {
                let h = (m.timeLeft.match(/(\d+)\s*h/i) || [0,0])[1];
                let mins = (m.timeLeft.match(/(\d+)\s*m/i) || [0,0])[1];
                localNowSecs = (parseInt(h) * 3600) + (parseInt(mins) * 60);
                nowInt = setInterval(() => {
                    if (localNowSecs <= 0) { nowEl.innerText = "Refreshing..."; clearInterval(nowInt); return; }
                    localNowSecs--; let hh = Math.floor(localNowSecs / 3600), mm = Math.floor((localNowSecs % 3600) / 60), ss = localNowSecs % 60;
                    nowEl.innerText = `Left: ${hh}h ${mm}m ${ss}s`;
                }, 1000);
            }

            clearInterval(nextInt); const nextEl = document.getElementById('m-time');
            if (!m.nextTime || m.nextTime.includes("--") || m.nextTime.includes("N/A")) {
                nextEl.innerText = "--";
            } else {
                let clean = m.nextTime.includes("202") ? m.nextTime : m.nextTime.replace(",", " 2026,");
                const target = new Date(clean);
                nextInt = setInterval(() => {
                    const diff = target - new Date();
                    if (diff <= 0) { nextEl.innerText = "Starting Now!"; clearInterval(nextInt); return; }
                    const dd = Math.floor(diff / 86400000), hh = Math.floor((diff % 86400000) / 3600000), mm = Math.floor((diff % 3600000) / 60000), ss = Math.floor((diff % 60000) / 1000);
                    nextEl.innerText = (dd > 0 ? dd + "d " : "") + `${hh}h ${mm}m ${ss}s`;
                }, 1000);
            }
        });

        const twitchLabApi = 'https://script.google.com/macros/s/AKfycby0ndGELJv0Q6yAR8PKMsvo3u-hZ2qAL80sVahxyeyrLy_qDXhkcYZkKBoq6HhdrhyO/exec';
        async function syncTwitch() { try { const res = await fetch(twitchLabApi + '?t=' + Date.now()); const data = await res.json(); if (data.twitch) { document.getElementById('twitch-fol-num').innerText = data.twitch.followers || "---"; document.getElementById('twitch-view-num').innerText = data.twitch.viewers || "0"; } } catch (e) {} }
        setInterval(syncTwitch, 60000); syncTwitch();

        function openCourt() {
            const modal = document.getElementById('courtModal');
            const player = document.getElementById('modal-player');
            player.src = "https://video.ibm.com/embed/23891775?autoplay=1";
            modal.style.display = "block";
        }
        function closeCourt() {
            const modal = document.getElementById('courtModal');
            const player = document.getElementById('modal-player');
            player.src = ""; modal.style.display = "none";
        }
        window.onclick = function(event) {
            const modal = document.getElementById('courtModal');
            if (event.target == modal) { closeCourt(); }
        }

        async function getBsky() { try { const r = await fetch('https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=briandivacox.bsky.social'); const p = await r.json(); if (p.followersCount !== undefined) document.getElementById('bsky-num').innerText = p.followersCount.toLocaleString(); } catch (e) {} }
        getBsky(); setInterval(getBsky, 300000);

        function monitorCourt() {
            if (typeof UstreamEmbed === 'undefined') { setTimeout(monitorCourt, 1000); return; }
            const viewer = UstreamEmbed('court-player');
            const check = () => {
                viewer.getProperty('live', (isLive) => {
                    const active = (isLive === true || isLive === 'live');
                    document.getElementById('court-dot').className = active ? 'dot live' : 'dot';
                    document.getElementById('court-text').innerText = active ? "LIVE NOW" : "OFF AIR";
                    document.getElementById('court-text').style.color = active ? "#ff0000" : "var(--text-dim)";
                    document.getElementById('court-subtitle').innerText = active ? "Judge David Online" : "Judge David";
                });
            };
            viewer.addListener('live', check); setInterval(check, 30000); check();
        }
        window.addEventListener('load', monitorCourt);
    </script>
</body>
</html>
