<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Dashboard v9.0.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script data-cfasync="false" src="https://video.ibm.com/embed-api/v1/ustream-embedapi.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117; --card-bg: #161b22; --border-color: #30363d;
            --text-main: #ffffff; --text-dim: #8b949e; 
            --plex-orange: #e5a00d; --cinema-green: #238636;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            margin: 0; 
        }

        /* Container for the whole dashboard */
        .counter-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            width: 100%; 
            max-width: 1400px; 
        }

        /* Generic Tile Style */
        .counter-item { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            height: 150px; 
            position: relative; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Standard Counter Inversion (Twitter, YT, etc.) */
        .counter-item iframe { 
            filter: invert(1) hue-rotate(180deg); 
            border: 0; 
            width: 450px; 
            height: 220px; 
            position: absolute; 
            top: 10px; 
            left: -85px; 
            pointer-events: none; 
        }

        /* --- THE COURT STREAM (PROTECTED ZONE) --- */
        #court-box { 
            padding: 0 !important; 
            border-top: 3px solid var(--plex-orange);
            background: #000;
            cursor: pointer;
        }

        .court-wrapper { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            position: relative; 
        }

        /* Reset alignment to 0,0 for the fresh start */
        .court-iframe { 
            width: 1200px; 
            height: 675px; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            transform: scale(0.30); 
            transform-origin: 0 0;
            pointer-events: none; 
            filter: none !important; /* PREVENTS DISTORTION */
        }

        /* Overlays */
        .status-container { 
            display: flex; align-items: center; gap: 8px; 
            position: absolute; bottom: 12px; left: 12px; 
            background: rgba(0,0,0,0.6); padding: 4px 10px; 
            border-radius: 20px; border: 1px solid var(--border-color);
            z-index: 10;
        }
        .dot { height: 8px; width: 8px; background-color: #484f58; border-radius: 50%; }
        .dot.live { background-color: #ff0000; box-shadow: 0 0 8px #ff0000; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .status-text { font-size: 10px; font-weight: bold; color: var(--text-dim); }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal-content { background-color: #161b22; margin: 5% auto; padding: 20px; border: 1px solid var(--plex-orange); width: 85%; max-width: 900px; border-radius: 12px; position: relative; }
        .close-modal { position: absolute; top: 10px; right: 20px; color: var(--text-dim); font-size: 35px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="counter-grid">
        <div class="counter-item" id="court-box" onclick="openCourt()">
            <div class="court-wrapper">
                <iframe id="court-player" class="court-iframe" src="https://video.ibm.com/embed/23891775?showtitle=false&volume=0"></iframe>
                
                <div style="position: absolute; top: 10px; left: 15px; z-index: 20; text-shadow: 2px 2px 4px #000;">
                    <h4 style="margin: 0; font-size: 14px; color: #fff;">Court Stream</h4>
                    <p id="court-subtitle" style="font-size: 11px; color: var(--plex-orange); margin: 0;">Judge David</p>
                </div>

                <div class="status-container">
                    <span id="court-dot" class="dot"></span>
                    <span id="court-text" class="status-text">OFF AIR</span>
                </div>
            </div>
        </div>

        <div class="counter-item" style="border-top: 3px solid #ffffff; padding-left: 25px;">
            <iframe scrolling="no" src="https://livecounts.io/embed/twitter-live-follower-counter/briandivacox"></iframe>
        </div>
    </div>

    <div id="courtModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCourt()">&times;</span>
            <h3 style="margin-top: 0; color: var(--plex-orange);">Live Court Feed</h3>
            <iframe id="modal-player" width="100%" height="500" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Popup Controls
        function openCourt() {
            document.getElementById('modal-player').src = "https://video.ibm.com/embed/23891775?autoplay=1";
            document.getElementById('courtModal').style.display = "block";
        }
        function closeCourt() {
            document.getElementById('modal-player').src = ""; 
            document.getElementById('courtModal').style.display = "none";
        }
        window.onclick = (e) => { if (e.target == document.getElementById('courtModal')) closeCourt(); }

        // Live Monitor Logic
        function monitorCourt() {
            if (typeof UstreamEmbed === 'undefined') { setTimeout(monitorCourt, 1000); return; }
            const viewer = UstreamEmbed('court-player');
            const check = () => {
                viewer.getProperty('live', (isLive) => {
                    const active = (isLive === true || isLive === 'live');
                    document.getElementById('court-dot').className = active ? 'dot live' : 'dot';
                    document.getElementById('court-text').innerText = active ? "LIVE NOW" : "OFF AIR";
                    document.getElementById('court-text').style.color = active ? "#ff0000" : "#8b949e";
                });
            };
            viewer.addListener('live', check); setInterval(check, 30000); check();
        }
        window.addEventListener('load', monitorCourt);
    </script>
</body>
</html>
