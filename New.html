<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Dashboard v7.8.9</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #ffffff; --green: #238636; --orange: #e5a00d; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .counter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; max-width: 1200px; }
        .counter-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; position: relative; }
        .stat-num { font-size: 2.5rem; font-weight: 800; margin: 10px 0; }
        .label { font-size: 10px; text-transform: uppercase; color: #8b949e; font-weight: bold; }
    </style>
</head>
<body>

    <div class="counter-grid">
        <div class="counter-item" style="border-top: 3px solid var(--orange);">
            <i class="fa-solid fa-server" style="color: var(--orange); position: absolute; top: 10px; right: 10px;"></i>
            <div class="label">Plex Watching</div>
            <div id="plex-count-num" class="stat-num">0</div>
        </div>

        <div class="counter-item" style="border-top: 3px solid var(--green); grid-column: span 2;">
            <div class="label">Now Playing</div>
            <div id="m-now" style="font-size: 1.2rem; font-weight: bold;">Syncing...</div>
            <div id="m-left" style="font-size: 14px; color: var(--orange);">--</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const sConf = { databaseURL: "https://livecounters-8eaa8-default-rtdb.firebaseio.com/" };
        const sApp = firebase.initializeApp(sConf, "sApp");
        const sDb = sApp.database();

        // PLEX & LAB DATA LISTENER
        sDb.ref('labData').on('value', (s) => {
            const d = s.val();
            if (d) {
                // This fix checks for multiple names your bridge might use
                document.getElementById('plex-count-num').innerText = d.plexCount || d.plex_sessions || d.watching || "0";
            }
        });

        // THEATER SYNC LISTENER
        sDb.ref('theaterSync').on('value', (s) => {
            const m = s.val();
            if (m) {
                document.getElementById('m-now').innerText = m.nowPlaying || "Off-Air";
                document.getElementById('m-left').innerText = m.timeLeft || "0h 0m";
            }
        });
    </script>
</body>
</html>
