<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14102c"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="cloudNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#ff5c8d"/>
    </linearGradient>
    <filter id="cloudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="192" height="192" rx="42" fill="url(#cloudBg)"/>
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="url(#cloudNeon)" stroke-width="2" opacity="0.5"/>
  
  <!-- Cloud Silhouette -->
  <path d="M142 126H56c-18.78 0-34-15.22-34-34 0-16.8 12.18-30.74 28.25-33.43C55.08 38.38 72.8 24 94 24c25.4 0 46.2 19.34 49.33 44.24C158.4 69.8 170 83.04 170 99c0 14.91-12.09 27-28 27z" 
        fill="none" stroke="url(#cloudNeon)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#cloudGlow)"/>
        
  <!-- Real-time Pulse Signal / Data Counter inside Cloud -->
  <path d="M54 94h20l10-18 16 34 14-22 10 10h24" 
        fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
