<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitch Lab v1.1.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .lab-card { background: #161b22; border: 1px solid #30363d; padding: 40px; border-radius: 20px; text-align: center; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); border-top: 4px solid #9146FF; position: relative; }
        .twitch-icon { color: #9146FF; font-size: 40px; margin-bottom: 10px; }
        .label { color: #8b949e; text-transform: uppercase; font-size: 11px; font-weight: bold; letter-spacing: 2px; }
        .number { font-size: 3.8rem; font-weight: 800; margin: 2px 0; color: #ffffff; letter-spacing: -2px; }
        
        /* New Live Viewers Secondary Row Styling */
        .viewer-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 10px 0 15px 0; background: rgba(145, 70, 255, 0.1); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(145, 70, 255, 0.2); }
        .viewer-label { color: #bc95ff; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        .viewer-number { font-size: 1.5rem; font-weight: bold; color: #ffffff; font-family: monospace; }

        .status-pill { display: inline-block; padding: 4px 12px; border-radius: 10px; font-size: 10px; font-weight: bold; background: #30363d; color: #8b949e; }
        .success { background: #238636; color: white; }
        .error { background: #da3633; color: white; }
        
        .log-box { margin-top: 25px; padding: 12px; background: #000; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 10px; text-align: left; border: 1px solid #30363d; height: 100px; overflow-y: auto; }
        .log-entry { margin-bottom: 6px; border-bottom: 1px solid #1c2128; padding-bottom: 4px; }
        .sync-timer-ui { position: absolute; top: 15px; right: 20px; font-size: 10px; color: #8b949e; font-weight: bold; }
        .version-tag { font-size: 9px; color: #8b949e; margin-top: 15px; display: block; }
        button { margin-top: 20px; background: #30363d; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; }
        button:hover { background: #3d444d; }
    </style>
</head>
<body>

    <div class="lab-card">
        <div class="sync-timer-ui">Next Sync: <span id="timer-val">60</span>s</div>
        <i class="fa-brands fa-twitch twitch-icon"></i>
        <div class="label">Twitch Followers</div>
        <div id="follower-count" class="number">---</div>
        
        <div class="viewer-row">
            <p class="viewer-label">👥 Live Viewers:</p>
            <span id="twitch-viewer-num" class="viewer-number">---</span>
        </div>

        <div id="status-tag" class="status-pill">READY</div>

        <div class="log-box" id="changelog">
            <div class="log-entry" style="color: #bc95ff;"><b>[System]</b> Version Sync v1.1.0 active. Dual pipelines verified.</div>
        </div>

        <button onclick="syncLab()">FORCE MANUAL SYNC</button>
        <span class="version-tag">Lab Interface: v1.1.0 | Script Engine: <span id="script-ver-ui">...</span></span>
    </div>

    <script>
        const followerApi = 'https://script.google.com/macros/s/AKfycby0ndGELJv0Q6yAR8PKMsvo3u-hZ2qAL80sVahxyeyrLy_qDXhkcYZkKBoq6HhdrhyO/exec';
        const firebaseApi = 'https://livecounters-8eaa8-default-rtdb.firebaseio.com/labData.json';
        let timeLeft = 60;

        async function syncLab() {
            const countEl = document.getElementById('follower-count');
            const viewerEl = document.getElementById('twitch-viewer-num');
            const statusEl = document.getElementById('status-tag');
            const logEl = document.getElementById('changelog');
            const verEl = document.getElementById('script-ver-ui');

            statusEl.innerText = "SYNCING...";
            
            try {
                // Pipeline 1: Fetch Follower Data from Google App Script
                const followerResponse = await fetch(followerApi + '?t=' + Date.now(), { method: 'GET', redirect: 'follow' });
                const followerData = await followerResponse.json();

                // Pipeline 2: Fetch Live Viewers from Python -> Firebase Realtime DB
                const firebaseResponse = await fetch(firebaseApi + '?t=' + Date.now());
                const firebaseData = await firebaseResponse.json();

                // Update UI Counters
                countEl.innerText = followerData.twitch.followers;
                viewerEl.innerText = firebaseData.twitchViewers !== undefined ? firebaseData.twitchViewers : 0;
                
                // Update Layout Status Indicators
                statusEl.innerText = followerData.twitch.status.toUpperCase();
                statusEl.className = followerData.twitch.status === "Success" ? "status-pill success" : "status-pill error";
                verEl.innerText = followerData.twitch.scriptVersion;

                // Add Success Console Log Entry
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `<span style="color:#8b949e">[${followerData.twitch.timestamp}]</span> Dual Sync Complete (F: ${followerData.twitch.followers} | V: ${firebaseData.twitchViewers})`;
                logEl.prepend(entry);
                
                timeLeft = 60; 

            } catch (err) {
                statusEl.innerText = "FETCH FAIL";
                statusEl.className = "status-pill error";
                
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `<span style="color:#da3633">[ERROR]</span> Sync pipeline failed: ${err.message}`;
                logEl.prepend(entry);
            }
        }

        setInterval(() => {
            timeLeft--;
            document.getElementById('timer-val').innerText = timeLeft;
            if (timeLeft <= 0) { syncLab(); }
        }, 1000);

        syncLab();
    </script>
</body>
</html>
