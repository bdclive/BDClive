<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Broadcast Studio Deck</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            height: calc(100vh - 30px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .studio-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #30363d;
            margin-bottom: 15px;
        }
        .studio-header h3 {
            margin: 0;
            color: #9146FF;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 800;
        }
        .workspace-deck {
            display: flex;
            gap: 15px;
            flex: 1;
            width: 100%;
            height: calc(100% - 45px);
        }
        .player-container {
            flex: 2.5;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            height: 100%;
            border: 1px solid #30363d;
        }
        .chat-container {
            flex: 1.3;
            background: #1f1f23;
            border-radius: 8px;
            overflow: hidden;
            height: 100%;
            border: 1px solid #30363d;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="studio-header">
        <i class="fa-brands fa-twitch" style="color: #9146FF; font-size: 20px;"></i>
        <h3>briandivacox Live Broadcast Studio</h3>
    </div>

    <div class="workspace-deck">
        <div class="player-container">
            <iframe id="studio-player" allowfullscreen></iframe>
        </div>
        <div class="chat-container">
            <iframe id="studio-chat" style="position: absolute; top: 0; left: 0;"></iframe>
        </div>
    </div>

    <script>
        // HARDCODED PRODUCTION HANDSHAKE: Explicitly listing authorization keys
        const p1 = "briandivacox.github.io";
        const p2 = "livecounters.nicepage.io";
        const p3 = "localhost";

        document.getElementById('studio-player').src = `https://player.twitch.tv/?channel=briandivacox&parent=${p1}&parent=${p2}&parent=${p3}&autoplay=1&muted=0`;
        document.getElementById('studio-chat').src = `https://www.twitch.tv/embed/briandivacox/chat?parent=${p1}&parent=${p2}&parent=${p3}&darkpopout=true`;
    </script>

</body>
</html>
